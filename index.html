<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Sessions</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --line:#272c37; --fg:#e6e9ef;
    --dim:#98a1b3; --accent:#7aa2f7; --ok:#3fb950;
  }
  @media (prefers-color-scheme:light){
    :root{ --bg:#f6f7f9; --card:#fff; --line:#e2e5ea; --fg:#1a1d23;
           --dim:#667; --accent:#2f5fd0; --ok:#197b34; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  header{
    position:sticky; top:0; z-index:1; background:var(--bg);
    border-bottom:1px solid var(--line); padding:16px 20px;
    display:flex; gap:12px; align-items:center; flex-wrap:wrap;
  }
  h1{margin:0; font-size:17px; font-weight:600; white-space:nowrap}
  #meta{color:var(--dim); font-size:13px; white-space:nowrap}
  #q{
    flex:1 1 220px; min-width:0; padding:8px 12px; font:inherit;
    color:var(--fg); background:var(--card);
    border:1px solid var(--line); border-radius:8px;
  }
  #q:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent}
  button{
    font:inherit; cursor:pointer; padding:8px 12px; border-radius:8px;
    color:var(--fg); background:var(--card); border:1px solid var(--line);
  }
  button:hover{border-color:var(--accent); color:var(--accent)}
  main{
    max-width:900px; margin:0 auto; padding:20px; display:grid;
    grid-template-columns:minmax(0,1fr); gap:12px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; min-width:0;
  }
  .card:hover{border-color:var(--accent)}
  .top{display:flex; gap:12px; align-items:baseline}
  .title{margin:0; font-size:15px; font-weight:600; flex:1; min-width:0; word-break:break-word}
  .when{color:var(--dim); font-size:12px; white-space:nowrap; cursor:help}
  .path{
    color:var(--dim); font-size:12.5px; margin:4px 0 10px;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .cmd{display:flex; gap:8px; align-items:center}
  .cmd code{
    flex:1; min-width:0; font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    font-size:12.5px; background:var(--bg); border:1px solid var(--line);
    border-radius:6px; padding:7px 10px; overflow-x:auto; white-space:nowrap;
  }
  .copy{font-size:12.5px; padding:6px 12px}
  .copy.done{color:var(--ok); border-color:var(--ok)}
  #empty{
    text-align:center; color:var(--dim); padding:48px 20px;
    max-width:62ch; margin:0 auto; overflow-wrap:anywhere;
  }
</style>
</head>
<body>

<header>
  <h1>Claude Sessions</h1>
  <input id="q" type="search" autocomplete="off" placeholder="Filter by title or project…  (press /)">
  <span id="meta"></span>
  <button id="reload" title="Re-read the session files">Refresh</button>
</header>

<main id="list"></main>
<p id="empty" hidden>Nothing matches that filter.</p>

<template id="card">
  <article class="card">
    <div class="top">
      <h2 class="title"></h2>
      <time class="when"></time>
    </div>
    <div class="path"></div>
    <div class="cmd">
      <code></code>
      <button class="copy" title="Copy to clipboard">Copy</button>
    </div>
  </article>
</template>

<script>
const $ = s => document.querySelector(s);
const list = $('#list'), tpl = $('#card');
let all = [], root = '', exists = true;

function ago(ts){
  const s = (Date.now() - ts * 1000) / 1000;
  if (s < 60) return 'just now';
  for (const [n, label] of [[31536000,'y'],[2592000,'mo'],[604800,'w'],[86400,'d'],[3600,'h'],[60,'m']])
    if (s >= n) return Math.floor(s / n) + label + ' ago';
}

function render(){
  const q = $('#q').value.trim().toLowerCase();
  const shown = q
    ? all.filter(s => (s.title + ' ' + s.project + ' ' + s.id).toLowerCase().includes(q))
    : all;

  list.replaceChildren();
  for (const s of shown){
    const node = tpl.content.cloneNode(true);
    node.querySelector('.title').textContent = s.title;

    const when = node.querySelector('.when');
    when.textContent = ago(s.mtime);
    when.title = new Date(s.mtime * 1000).toLocaleString();

    const path = node.querySelector('.path');
    path.textContent = s.project;
    path.title = s.project;

    node.querySelector('code').textContent = s.cmd;

    const btn = node.querySelector('.copy');
    btn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(s.cmd);
        btn.textContent = 'Copied';
        btn.classList.add('done');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1200);
      } catch {
        btn.textContent = 'Press Ctrl+C';
      }
    };
    list.append(node);
  }

  // Two different kinds of nothing: no history at all, vs. a filter that
  // matched none of it. A first-time user needs telling which one they hit.
  const empty = $('#empty');
  if (all.length === 0) {
    empty.hidden = false;
    empty.textContent = exists
      ? `No sessions in ${root} yet. Use Claude Code, then press Refresh.`
      : `No Claude Code history found. ${root} is created the first time you run Claude Code.`;
  } else if (shown.length === 0) {
    empty.hidden = false;
    empty.textContent = 'Nothing matches that filter.';
  } else {
    empty.hidden = true;
  }

  const projects = new Set(all.map(s => s.project)).size;
  $('#meta').textContent = all.length
    ? `${shown.length}/${all.length} sessions · ${projects} projects`
    : 'no sessions found';
}

async function load(){
  $('#meta').textContent = 'loading…';
  try {
    const data = await (await fetch('/api/sessions')).json();
    all = data.sessions || [];
    root = data.root || '';
    exists = data.exists !== false;
  } catch (e) {
    $('#meta').textContent = 'could not read sessions — is the server still running?';
    return;
  }
  render();
}

$('#q').addEventListener('input', render);
$('#reload').addEventListener('click', load);
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#q')){ e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape' && document.activeElement === $('#q')){ $('#q').value = ''; render(); $('#q').blur(); }
});

load();
</script>
</body>
</html>
